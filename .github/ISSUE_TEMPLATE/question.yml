name: "❓ Question sur une séance"
description: "Poser une question ou signaler un blocage"
title: "[S?] Titre de votre question"
labels: ["question"]
body:
  - type: dropdown
    id: seance
    attributes:
      label: "Séance concernée"
      options:
        - "Mise en route (Codespace, lancement, tests du socle)"
        - "Séance 1 – Moniteur 1 : la file d'attente"
        - "Séance 2 – Le modèle de données"
        - "Séance 3 – Moniteur 2 : le plateau"
        - "Séance 4 – Affecter un contact"
        - "Séance 5 – Temps réel et quatre moniteurs"
        - "Séance 6 – Moniteur 3 et sécurité"
        - "Séance 7 – Moniteur 4 : indicateurs et alertes"
        - "Séance 8 – Avant la mise en service"
    validations:
      required: true
  - type: input
    id: mission
    attributes:
      label: "Mission"
      placeholder: "ex : 4.3"
  - type: input
    id: commande
    attributes:
      label: "Commande exécutée ou page ouverte"
      placeholder: "ex : dotnet test --filter Groupe=seance-04"
    validations:
      required: true
  - type: textarea
    id: erreur
    attributes:
      label: "Message d'erreur complet"
      description: "Copiez-collez le message (terminal, test ou console du navigateur)."
      render: shell
    validations:
      required: true
  - type: textarea
    id: tentatives
    attributes:
      label: "Ce que j'ai déjà essayé"
